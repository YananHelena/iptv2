name: Update Turkey TV Playlist + EPG

on:
  workflow_dispatch:
  schedule:
    # Refresh dynamic public live URLs every 4 hours.
    - cron: "17 */4 * * *"

concurrency:
  group: update-turkey-tv
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STREAM_HEALTHCHECK: "1"
      STREAM_HEALTH_FAIL_OPEN: "1"
      STREAM_HEALTH_TIMEOUT: "8"
      OFFICIAL_RESOLVER_TIMEOUT: "40"
      MAX_IPTV_ORG_CANDIDATES: "3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Deno for YouTube JS challenges
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install live-page resolver
        run: python -m pip install --upgrade "yt-dlp[default,curl-cffi]"

      - name: Build curated playlist with health checks
        run: python build_playlist.py

      - name: Build XMLTV EPG for current playlist
        run: python build_epg.py

      - name: Show playlist summary
        run: |
          echo "--- Playlist report summary ---"
          python - <<'PY'
          import csv
          from collections import Counter
          rows = list(csv.DictReader(open('playlist-report.csv', encoding='utf-8-sig')))
          print('Configured:', len(rows))
          print('Included:', sum(r['status'].startswith('added_') for r in rows))
          print('Statuses:')
          for k, v in Counter(r['status'] for r in rows).most_common():
              print(f'  {k}: {v}')
          failed = [r for r in rows if not r['status'].startswith('added_')]
          if failed:
              print('Unavailable:')
              for r in failed:
                  print(f"  ch {r['digiturk_number']:>3} {r['wanted_name']}: {r['status']} | {r['health_detail'][:320]}")
          PY

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turkiye-tv.m3u playlist-report.csv turkiye-epg.xml turkiye-epg.xml.gz match-report.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Turkey TV playlist and EPG"
            git push
          fi
